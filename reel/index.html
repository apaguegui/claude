<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  :root { --ocre:#DE9D0F; --tinta:#1E1A10; --crema:#FFF6E0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:var(--ocre); }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--ocre); }
  .scene { position:absolute; inset:0; opacity:0; overflow:hidden; }
  .scene img.photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform; }
  .shade { position:absolute; left:0; right:0; bottom:0; height:46%;
           background:linear-gradient(to top, rgba(30,26,16,.82), rgba(30,26,16,0)); }
  .cap { position:absolute; left:80px; right:80px; bottom:250px; color:var(--crema);
         font-family:"DejaVu Serif",serif; font-weight:bold; font-size:96px; line-height:1.05;
         text-shadow:0 4px 18px rgba(0,0,0,.45); }
  .cap small { display:block; font-family:"Liberation Sans",sans-serif; font-weight:normal;
               font-size:44px; letter-spacing:.06em; margin-top:22px; color:var(--ocre); text-transform:uppercase; }
  .bar { position:absolute; left:80px; bottom:220px; height:8px; width:160px; background:var(--ocre); border-radius:4px; }
  .badge { position:absolute; top:110px; left:50%; width:420px; margin-left:-210px; border-radius:22px;
           box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .card { background:var(--ocre); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .card img.logo { width:1000px; }
  .card .line { font-family:"Liberation Sans",sans-serif; color:var(--tinta); font-size:44px;
                letter-spacing:.14em; text-transform:uppercase; margin-top:40px; text-align:center; }
  .card .big { font-family:"DejaVu Serif",serif; font-weight:bold; color:var(--tinta); font-size:92px; margin-top:60px; text-align:center; line-height:1.1; }
</style></head>
<body><div id="stage">
  <div class="scene card" id="s0">
    <img class="logo" src="../logo.png.jpeg">
    <div class="line">Panadería artesanal</div>
  </div>
  <div class="scene" id="s1"><img class="photo" src="../WhatsApp%20Image%202026-10-12%20at%2019.56.29.jpeg">
    <div class="shade"></div><div class="cap">Medialunas<br>recién hechas<small>Todas las mañanas</small></div></div>
  <div class="scene" id="s2"><img class="photo" src="../WhatsApp%20Image%202026-10-12%20at%2019.56.29%20(3).jpeg">
    <div class="shade"></div><div class="cap">Masas finas<small>Con fruta y crema</small></div></div>
  <div class="scene" id="s3"><img class="photo" src="../WhatsApp%20Image%202026-10-12%20at%2019.56.29%20(2).jpeg">
    <div class="shade"></div><div class="cap">Hojaldres<small>Dorados y crocantes</small></div></div>
  <div class="scene" id="s4"><img class="photo" src="../WhatsApp%20Image%202026-10-12%20at%2019.56.29%20(1).jpeg">
    <div class="shade"></div><div class="cap">Chipá<small>Calentito</small></div></div>
  <div class="scene" id="s5"><img class="photo" src="../WhatsApp%20Image%202026-10-12%20at%2019.56.30.jpeg">
    <div class="shade"></div><div class="cap">Churros<small>Con azúcar y canela</small></div></div>
  <div class="scene card" id="s6">
    <img class="logo" src="../logo.png.jpeg">
    <div class="big">Te esperamos</div>
    <div class="line">Recién horneado, todos los días</div>
  </div>
</div>
<script>
// Escenas: [inicio, fin] en segundos (se superponen 0.5 s para el fundido)
const S = [[0,2.4],[1.9,5.6],[5.1,7.6],[7.1,9.6],[9.1,11.4],[10.9,13.0],[12.5,15.0]];
const FADE = 0.5;
const ease = x => x<=0?0:x>=1?1:1-Math.pow(1-x,3);           // easeOutCubic
const clamp = x => Math.max(0,Math.min(1,x));
const zoomDir = [0, 1, -1, 1, -1, 1, 0];                      // zoom in / out alternado
const panX   = [0, 0, 30, -30, 30, -30, 0];
window.renderAt = function(t){
  S.forEach(([a,b],i)=>{
    const el = document.getElementById('s'+i);
    let o = 1;
    if (i>0 && t < a+FADE) o = clamp((t-a)/FADE);
    if (i<S.length-1 && t > b-FADE) o = Math.min(o, clamp((b-t)/FADE));
    if (t<a || t>b) o = 0;
    if (i===S.length-1 && t>=a+FADE) o = 1;
    el.style.opacity = o;
    const p = clamp((t-a)/(b-a));
    const img = el.querySelector('.photo');
    if (img) {
      const z = zoomDir[i]>0 ? 1.04 + 0.12*p : 1.16 - 0.12*p;   // zoom lento
      img.style.transform = `scale(${z}) translateX(${panX[i]*(p-0.5)}px)`;
      const cap = el.querySelector('.cap'); const k = ease((t-a-0.25)/0.7);
      cap.style.opacity = k; cap.style.transform = `translateY(${(1-k)*70}px)`;
    } else {
      const k = ease((t-a)/0.9);
      el.querySelector('.logo').style.transform = `scale(${0.85+0.15*k + 0.03*p})`;
      el.querySelector('.logo').style.opacity = k;
      el.querySelectorAll('.line,.big').forEach((n,j)=>{
        const q = ease((t-a-0.4-0.2*j)/0.7); n.style.opacity=q; n.style.transform=`translateY(${(1-q)*40}px)`; });
    }
  });
};
window.renderAt(0);
</script></body></html>
